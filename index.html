<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Health Plus Travels Events</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <meta name="theme-color" content="#1A56A0" />

    <style>
      /* Splash screen — visible instantly before React mounts.
         Removed automatically by main.tsx once the app is ready. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: linear-gradient(135deg, #1A56A0 0%, #00B89F 100%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        transition: opacity 320ms ease-out;
      }
      #app-splash.is-hiding { opacity: 0; pointer-events: none; }
      #app-splash .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.5px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      }
      #app-splash .splash-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
        opacity: 0.95;
      }
      #app-splash .splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.25);
        border-top-color: #ffffff;
        animation: splash-spin 0.85s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-spinner { animation-duration: 1.6s; }
        #app-splash { transition: none; }
      }
    </style>

    
    <meta property="og:image" content="/og-image.png">
    <meta property="og:title" content="Health Plus Travels Events">
  <meta name="twitter:title" content="Health Plus Travels Events">
  <meta name="description" content="Lovable Generated Project">
  <meta property="og:description" content="Lovable Generated Project">
  <meta name="twitter:description" content="Lovable Generated Project">
  <meta name="twitter:image" content="/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
</head>

  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-logo">H+</div>
      <div class="splash-spinner"></div>
      <div class="splash-title" id="app-splash-status">Cargando…</div>
    </div>
    <script>
      // Splash status updater — decoupled from React via CustomEvent.
      // React (useAuth, EventProvider) dispatches `app:init` events with
      // { detail: { step: '...' } } to keep the user informed during boot.
      window.addEventListener('app:init', function (e) {
        var el = document.getElementById('app-splash-status');
        if (el && e.detail && e.detail.step) el.textContent = e.detail.step;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
